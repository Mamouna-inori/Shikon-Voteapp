# ワークフローの名前
name: Deploy Flutter Web to GitHub Pages

# ワークフローが実行されるタイミング
on:
  # mainブランチにpushされた時
  push:
    branches:
      - main

# 実行するジョブ
jobs:
  build_and_deploy:
    # 最新のUbuntu環境で実行する
    runs-on: ubuntu-latest

    steps:
      # ステップ1: ソースコードリポジトリをチェックアウト（=コピーしてくる）
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ステップ2: Flutter環境をセットアップ
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # 安定版のFlutterを使用

      # ステップ3: Flutter Webアプリをビルド
      - name: Build Flutter Web App
        run: |
          flutter clean
          flutter pub get
          flutter build web

      # ステップ4: ビルド成果物を公開用リポジトリにデプロイ
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # (A)で設定するアクセストークン
          token: ${{ secrets.DEPLOY_TOKEN }}
          # (B)デプロイ先のリポジトリ名
          repository-name: Mamouna-inori/mamouna-inori.github.io
          # (C)デプロイ先のブランチ名
          branch: main
          # (D)デプロイするフォルダ
          folder: build/web